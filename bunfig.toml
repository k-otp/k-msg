# Bun configuration for the k-msg workspace. Bun ignores keys it does not
# know, so keep to https://bun.com/docs/runtime/bunfig.
[test]
root = "."
# Coverage is opt-in (`bun test --coverage`, `bun run test:coverage`), and
# test files are left out so the numbers describe source code. No
# coverageThreshold: Bun applies it to each file, and several source files
# have no direct tests yet, so any threshold would fail every coverage run.
coverageSkipTestFiles = true

[install]
registry = "https://registry.npmjs.org/"

[run]
silent = false
shell = "system"
