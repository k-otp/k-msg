name: Standalone Examples

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "examples/**"
      - "scripts/examples/check-standalone.ts"
      - ".github/workflows/examples-standalone.yml"
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-examples-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  validate:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - node-express-otp
          - bun-order-notifications
          - cloudflare-worker-d1
          - cloudflare-worker-queue-do
          - cloudflare-worker-hyperdrive
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install and validate standalone example
        run: bun run scripts/examples/check-standalone.ts --example "${{ matrix.example }}"
