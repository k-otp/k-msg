name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:


permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: bundle-size-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect bundle-size target changes
        id: bundle_paths
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch origin "$DEFAULT_BRANCH" --depth=1
              BASE="origin/$DEFAULT_BRANCH"
            fi
          fi

          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -Eq '^(packages/(core|template|messaging|provider|k-msg)/|scripts/ci/check-bundle-size\.sh|scripts/ci/README\.md|package\.json|bun\.lock|\.github/workflows/ci\.yml)'; then
            echo "should_run=true" >>"$GITHUB_OUTPUT"
          else
            echo "should_run=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Run bundle-size guard
        if: steps.bundle_paths.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: ./scripts/ci/check-bundle-size.sh

      - name: Skip bundle-size guard
        if: steps.bundle_paths.outputs.should_run != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No bundle-size target changes detected; skipping bundle-size guard."

  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: docs-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect docs-check target changes
        id: docs_paths
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
              git fetch origin "$DEFAULT_BRANCH" --depth=1
              BASE="origin/$DEFAULT_BRANCH"
            fi
          fi

          CHANGED="$(git diff --name-only "$BASE" "${{ github.sha }}")"
          if echo "$CHANGED" | grep -Eq '^(packages/|apps/cli/|examples/|apps/docs/|scripts/docs/|package\.json|bun\.lock)'; then
            echo "should_run=true" >>"$GITHUB_OUTPUT"
          else
            echo "should_run=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Run docs checks
        if: steps.docs_paths.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: ./scripts/ci/docs-check-with-retry.sh 3

      - name: Skip docs checks
        if: steps.docs_paths.outputs.should_run != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No docs-check target changes detected; skipping docs:check."

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    # A real Postgres and MariaDB for the SQL adapter integration tests in
    # packages/messaging; they are skipped when KMSG_TEST_POSTGRES_URL or
    # KMSG_TEST_MYSQL_URL is unset.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: kmsg
          POSTGRES_PASSWORD: kmsg
          POSTGRES_DB: kmsg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmsg -d kmsg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4@sha256:2f45480c9cac0545cd723ad0006d6ac28e173eeb6120b83ab31efc1a043dd325
        env:
          MARIADB_ROOT_PASSWORD: kmsg
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KMSG_TEST_POSTGRES_URL: postgres://kmsg:kmsg@localhost:5432/kmsg_test
      # Root, since the tests create and drop their own database.
      KMSG_TEST_MYSQL_URL: mysql://root:kmsg@localhost:3306/mysql
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore ttsc plugin cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'lint.config.ts', 'lint.evidence.config.ts') }}
          restore-keys: |
            ttsc-${{ runner.os }}-${{ runner.arch }}-

      - name: CLI completions doctor (strict)
        run: bun run --cwd apps/cli doctor:completions

      - name: Warn if changeset missing
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"

          if echo "$CHANGED" | grep -Eq '^(packages/|apps/cli/)'; then
            if ! echo "$CHANGED" | grep -q '^\.sampo/changesets/.*\.md$'; then
              echo "::warning::Releaseable changes detected without a Sampo changeset. Run 'sampo add' and commit the generated file under .sampo/changesets/."
            fi
          fi

      - name: Biome check
        run: bun run check --diagnostic-level=error

      - name: Canonical checks
        run: bun run check:ci

      - name: Vanilla TypeScript parity check
        run: bun run typecheck:tsc

  crypto-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: crypto-regression-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Messaging crypto regression tests
        run: bun --cwd packages/messaging test src/delivery-tracking/field-crypto-policy.test.ts src/delivery-tracking/crypto-control-plane.test.ts

      - name: Webhook crypto regression tests
        run: bun --cwd packages/webhook test src/services/webhook.registry.crypto.test.ts src/runtime/webhook-runtime.crypto.test.ts

  drizzle-compat:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        drizzle: ["0.44.7", "0.45.2", "beta"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pin drizzle-orm matrix version
        run: bun add --cwd packages/messaging --dev --exact --no-save drizzle-orm@${{ matrix.drizzle }}

      - name: Build core types for workspace references
        run: bun run --cwd packages/core build:types

      - name: Messaging typecheck
        run: bun run --cwd packages/messaging typecheck

      - name: Drizzle adapter tests
        run: bun --cwd packages/messaging test src/adapters/cloudflare/cloudflare-adapters.test.ts

      - name: Drizzle schema render snapshot tests
        run: bun --cwd packages/messaging test src/adapters/cloudflare/sql-schema.test.ts
