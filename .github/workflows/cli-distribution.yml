name: CLI Distribution

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/package.json"
      - "apps/cli/CHANGELOG.md"
      - "apps/cli/install/**"
      - "apps/cli/src/config/schema.ts"
      - "apps/cli/src/config/constants.ts"
      - "apps/cli/scripts/generate-config-schema.ts"
      - "apps/cli/schemas/**"
      - ".github/workflows/cli-distribution.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release (branch, tag, or sha)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: cli-dist-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24"
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node (for npm OIDC)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify config schema artifacts
        run: bun run --cwd apps/cli schema:check

      - name: Debug runner
        run: |
          set -euo pipefail
          uname -a
          uname -m
          bun --version
          node --version

      - name: Read CLI version
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(bun pm pkg get version --cwd apps/cli | tr -d '\"')"
          echo "version=${VERSION}" >>"$GITHUB_OUTPUT"
          echo "tag=cli-v${VERSION}" >>"$GITHUB_OUTPUT"

      - name: Check if GitHub Release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          expected_assets=(
            "k-msg-cli-${VERSION}-darwin-arm64.tar.gz"
            "k-msg-cli-${VERSION}-darwin-x64.tar.gz"
            "k-msg-cli-${VERSION}-linux-arm64.tar.gz"
            "k-msg-cli-${VERSION}-linux-x64.tar.gz"
            "k-msg-cli-${VERSION}-windows-x64.tar.gz"
          )

          if gh release view "$TAG" --json assets >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"

            release_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            missing_assets=0
            for expected in "${expected_assets[@]}"; do
              if ! printf '%s\n' "$release_assets" | grep -Fxq "$expected"; then
                echo "Missing release asset: $expected"
                missing_assets=1
              fi
            done

            if [[ "$missing_assets" -eq 0 ]]; then
              echo "assets_ready=true" >>"$GITHUB_OUTPUT"
              echo "should_build=false" >>"$GITHUB_OUTPUT"
            else
              echo "assets_ready=false" >>"$GITHUB_OUTPUT"
              echo "should_build=true" >>"$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "assets_ready=false" >>"$GITHUB_OUTPUT"
            echo "should_build=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Check if CLI version is already on npm
        id: npm
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          if npm view "@k-msg/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "should_publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Build workspace packages (for CLI bundle)
        if: ${{ steps.release.outputs.should_build == 'true' }}
        run: bun run build:all

      - name: Build CLI (all targets)
        if: ${{ steps.release.outputs.should_build == 'true' }}
        run: bun run --cwd apps/cli build:all

      - name: Completions smoke (source)
        if: ${{ steps.release.outputs.should_build == 'true' }}
        run: bun --cwd apps/cli src/k-msg.ts completions bash >/dev/null

      - name: Completions smoke (built binary)
        if: ${{ steps.release.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          TARBALL="$(find apps/cli/dist -maxdepth 1 -type f -name '*.tar.gz' | sort | head -n 1)"
          if [[ -z "$TARBALL" ]]; then
            echo "Unable to find compressed CLI artifacts in apps/cli/dist"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          tar -xzf "$TARBALL" -C "$TMP_DIR"

          BIN="$(find "$TMP_DIR" -type f \( -name 'k-msg' -o -name 'k-msg.exe' \) | head -n 1)"
          if [[ -z "$BIN" ]]; then
            echo "Unable to find built CLI binary in extracted artifact"
            exit 1
          fi
          "$BIN" completions zsh >/dev/null

      - name: Prepare release assets
        if: ${{ steps.release.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          rm -rf apps/cli/dist/release
          mkdir -p apps/cli/dist/release
          shopt -s nullglob
          tarballs=(apps/cli/dist/*.tar.gz)

          if [[ ${#tarballs[@]} -eq 0 ]]; then
            echo "No compressed CLI artifacts found in apps/cli/dist"
            ls -la apps/cli/dist
            exit 1
          fi

          for f in "${tarballs[@]}"; do
            base="$(basename "$f")"
            target="${base%.tar.gz}"
            cp "$f" "apps/cli/dist/release/k-msg-cli-${VERSION}-${target}.tar.gz"
          done

          (cd apps/cli/dist/release && shasum -a 256 ./*.tar.gz > checksums.txt)

      - name: Upload assets to GitHub Release
        if: ${{ steps.release.outputs.should_build == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ env.RELEASE_REF }}
          name: k-msg CLI v${{ steps.meta.outputs.version }}
          files: apps/cli/dist/release/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Pack CLI for npm
        id: pack
        if: ${{ steps.npm.outputs.should_publish == 'true' }}
        run: |
          set -euo pipefail
          TARBALL_REL="$(cd apps/cli && bun pm pack --destination dist/npm --ignore-scripts --quiet | tail -n 1)"
          TARBALL_ABS="$(cd apps/cli && realpath "$TARBALL_REL")"
          echo "tarball=${TARBALL_ABS}" >>"$GITHUB_OUTPUT"

      - name: Publish CLI to npm (OIDC)
        if: ${{ steps.npm.outputs.should_publish == 'true' }}
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public

  deploy-installer-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write # publish the installer site
      id-token: write # authenticate the Pages deployment
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare Pages installer files
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-and-release.outputs.version }}"
          TAG="${{ needs.build-and-release.outputs.tag }}"
          PAGES_DIR=".pages"
          CLI_DIR="${PAGES_DIR}/cli"

          mkdir -p "$CLI_DIR"

          sed "s/__CLI_VERSION__/${VERSION}/g" apps/cli/install/install.sh > "${CLI_DIR}/install.sh"
          chmod +x "${CLI_DIR}/install.sh"

          cat > "${CLI_DIR}/latest.json" <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "releaseBaseUrl": "https://github.com/k-otp/k-msg/releases/download/${TAG}",
            "updatedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
