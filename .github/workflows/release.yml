name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it uses. The Sampo job runs third-party code and
# installers fetched at run time, so it never receives `id-token: write`,
# which is enough to publish to npm through trusted publishing, nor
# `actions: write`, which with its `contents: write` could push a branch and
# dispatch a privileged workflow on it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.publish_check.outputs.should_publish }}
      has_changesets: ${{ steps.changesets.outputs.has_changesets }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish check (npm registry)
        id: publish_check
        run: bash ./scripts/publish-oidc.sh --check

      - name: Detect pending changesets
        id: changesets
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(.sampo/changesets/*.md)
          has_changesets=false

          for f in "${files[@]}"; do
            if [[ "$(basename "$f")" != ".gitignore" ]]; then
              has_changesets=true
              break
            fi
          done

          echo "has_changesets=${has_changesets}" >>"$GITHUB_OUTPUT"

  release-pr:
    needs: plan
    # Keep the release PR branch up to date whenever pending changesets exist.
    if: ${{ needs.plan.outputs.has_changesets == 'true' && needs.plan.outputs.should_publish != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release PR branch
      pull-requests: write # open or update the release PR
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run Sampo (release PR only)
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@d3f4020892ba2a8fd56298e417053bb86736fa88 # cargo-sampo-github-action-v0.19.0
        with:
          command: auto
          create-github-release: false
          base-branch: main
          pr-branch: sampo/release
          pr-title: "chore(release): publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sampo refreshes bun.lock with `bun update --lockfile-only --no-save`,
      # which also moves every dependency, and the lockfile's copy of the
      # catalog, to the newest versions while package.json keeps its ranges.
      # CI's frozen install then rejects the lockfile, and the release would
      # ship dependency updates nobody reviewed. Rebuild it from main's
      # lockfile instead, so it records only the new workspace versions.
      # `--lockfile-only` installs nothing, so no dependency code runs here.
      - name: Keep only the version bumps in the release lockfile
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin sampo/release >/dev/null; then
            echo "No release branch; nothing to fix."
            exit 0
          fi
          git fetch --no-tags origin main sampo/release
          git switch --discard-changes --force-create sampo/release origin/sampo/release
          git checkout origin/main -- bun.lock
          bun install --lockfile-only
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already records only the version bumps."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(release): keep only the version bumps in bun.lock" -- bun.lock
          git push origin sampo/release

  # Pushes made with GITHUB_TOKEN do not trigger CI, so dispatch it for the
  # release PR branch from a job that runs no third-party code.
  release-ci:
    needs: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch CI on the release PR branch
      contents: read
    steps:
      - name: Trigger CI for release PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/branches/sampo/release" >/dev/null 2>&1; then
            gh workflow run ci.yml --repo "${GITHUB_REPOSITORY}" --ref sampo/release
          else
            echo "sampo/release branch not found; skipping CI dispatch."
          fi

  publish:
    needs: plan
    if: ${{ needs.plan.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push release tags and create the GitHub release
      id-token: write # npm trusted publishing
    steps:
      # Publish exactly the merged commit that triggered the run.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node (for npm OIDC)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies for publish validation
        run: bun install --frozen-lockfile

      - name: Pre-publish smoke checks
        run: |
          set -euo pipefail
          bun run --cwd packages/core build:types
          bun run --cwd packages/messaging typecheck
          bun --cwd packages/messaging test src/adapters/cloudflare/cloudflare-adapters.test.ts src/adapters/cloudflare/sql-schema.test.ts src/delivery-tracking/field-crypto-policy.test.ts src/delivery-tracking/crypto-control-plane.test.ts
          bun --cwd packages/webhook test src/services/webhook.registry.crypto.test.ts

      - name: Pre-publish npm pack smoke checks
        run: bash ./scripts/ci/npm-pack-smoke.sh

      - name: Publish packages (npm OIDC)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/publish-oidc.sh
